<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Decatur Fire — Chiefs Issue Review</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    body{margin:0;font:15px/1.35 system-ui;background:#f6f7f8}
    header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0}
    main{max-width:1100px;margin:0 auto;padding:14px}
    .card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}
    label{display:block;font-weight:700;margin:8px 0 6px}
    select,input,button{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #d7dbe0;font:inherit}
    .row{display:grid;gap:12px}
    @media(min-width:900px){.row{grid-template-columns:1fr 1fr 1fr 1fr}}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #e7eaef;vertical-align:top}
    th{font-size:12px;color:#444;text-transform:uppercase;letter-spacing:.04em}
    .btn{border:none;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer}
    .btnA{background:#e9eefc}
    .btnP{background:#fff3cd}
    .btnR{background:#d1f7d7}
    .btnC{background:#ffe0e0}
    .muted{color:#666;font-size:13px}
    .tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef1f5;font-size:12px;font-weight:800}
  </style>
</head>
<body>
<header>
  <div style="font-weight:900">Chiefs — Issue Review</div>
  <div class="muted" style="color:#ddd">Acknowledge • In Progress • Resolved • Clear</div>
</header>

<main>
  <div class="card">
    <div class="row">
      <div>
        <label>Chief</label>
        <input id="chiefName" placeholder="Name">
      </div>
      <div>
        <label>Station</label>
        <select id="station"></select>
      </div>
      <div>
        <label>Apparatus</label>
        <select id="apparatus"></select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="refresh" class="btn" style="background:#111;color:#fff">Refresh</button>
      </div>
    </div>
    <div class="muted" style="margin-top:10px" id="status">Loading…</div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>Station / Apparatus</th>
          <th>Issue</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="/chief.js"></script>
</body>
</html>
