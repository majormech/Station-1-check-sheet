<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DFD Chiefs — Active Issues</title>
  <meta name="theme-color" content="#c41212" />
  <style>
    :root{
      --brand:#c41212;
      --ink:#111;
      --muted:#666;
      --bg:#f7f7f8;
      --card:#fff;
      --border:#e5e7eb;
      --ok:#16a34a;
      --warn:#f59e0b;
      --bad:#dc2626;
      --chip:#f3f4f6;
      --shadow: 0 8px 30px rgba(0,0,0,.08);
      --radius: 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    body{ margin:0; background:var(--bg); color:var(--ink); }
    header{
      background:var(--brand);
      color:#fff;
      padding:14px 16px;
      position:sticky; top:0; z-index:10;
      box-shadow: 0 2px 14px rgba(0,0,0,.18);
    }
    header .title{ font-weight:800; font-size:16px; }
    header .sub{ opacity:.9; font-size:12px; margin-top:2px; }

    main{ max-width:1100px; margin:0 auto; padding:14px 12px 24px; }
    .grid{ display:grid; gap:12px; }
    @media (min-width: 900px){
      .grid{ grid-template-columns: 370px 1fr; align-items:start; }
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:12px;
    }
    .card h2{
      margin:0 0 10px;
      font-size:14px;
      letter-spacing:.2px;
    }

    label{ font-size:12px; color:var(--muted); display:block; margin:10px 0 6px; }
    select, input[type="text"]{
      width:100%;
      padding:10px 10px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:14px;
      background:#fff;
      box-sizing:border-box;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > *{ flex:1; min-width: 140px; }

    .btn{
      border:1px solid var(--border);
      background:#fff;
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:650;
      font-size:13px;
    }
    .btn.primary{ background:var(--brand); color:#fff; border-color:transparent; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .toggle{
      display:flex; align-items:center; gap:10px; margin-top:10px;
      color:var(--muted); font-size:13px;
    }
    .toggle input{ transform: scale(1.1); }

    .pill{
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:6px 10px;
      background:var(--chip);
      border:1px solid var(--border);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .status-chip{
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      display:inline-block;
      border:1px solid var(--border);
      background:#fff;
    }
    .st-NEW{ color:var(--bad); border-color: rgba(220,38,38,.25); background: rgba(220,38,38,.06); }
    .st-ACKNOWLEDGED{ color:var(--warn); border-color: rgba(245,158,11,.25); background: rgba(245,158,11,.08); }
    .st-IN_PROGRESS{ color:#2563eb; border-color: rgba(37,99,235,.25); background: rgba(37,99,235,.08); }
    .st-RESOLVED{ color:var(--ok); border-color: rgba(22,163,74,.25); background: rgba(22,163,74,.08); }
    .st-CLEARED{ color:var(--muted); border-color: rgba(107,114,128,.25); background: rgba(107,114,128,.08); }

    .issue{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      background:#fff;
      margin-bottom:10px;
    }
    .issue-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      margin-bottom:8px;
    }
    .issue-title{ font-weight:800; font-size:14px; margin:0; }
    .issue-meta{ font-size:12px; color:var(--muted); margin-top:4px; line-height:1.3; }
    .issue-text{ margin:8px 0 0; font-size:14px; }
    .issue-note{
      margin:8px 0 0;
      padding:8px 10px;
      border-left:4px solid var(--border);
      background:#fafafa;
      border-radius:10px;
      font-size:13px;
      color:#333;
      white-space:pre-wrap;
    }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .actions .btn{ padding:8px 10px; font-size:12px; }
    .btn.ack{ border-color: rgba(245,158,11,.35); }
    .btn.prog{ border-color: rgba(37,99,235,.35); }
    .btn.res{ border-color: rgba(22,163,74,.35); }
    .btn.clear{ border-color: rgba(107,114,128,.35); }

    .muted{ color:var(--muted); }
    .error{ color:var(--bad); font-weight:700; }
    .small{ font-size:12px; }
    .sep{ height:1px; background:var(--border); margin:12px 0; }

    .empty{
      text-align:center;
      padding:20px 12px;
      color:var(--muted);
      border:1px dashed var(--border);
      border-radius:14px;
      background:#fff;
    }
    .footerline{
      margin-top:10px;
      display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      color:var(--muted); font-size:12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Decatur Fire — Chiefs Issue Board</div>
    <div class="sub">Acknowledge • In Progress • Resolved • Clear</div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Controls</h2>

      <label for="backendUrl">Apps Script Web App URL (ends in /exec)</label>
      <input id="backendUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec" />

      <label for="chiefName">Chief / Reviewer Name</label>
      <input id="chiefName" type="text" placeholder="e.g., Chief Smith" />

      <div class="row">
        <div>
          <label for="stationSelect">Station</label>
          <select id="stationSelect"></select>
        </div>
        <div>
          <label for="apparatusSelect">Apparatus (optional filter)</label>
          <select id="apparatusSelect"></select>
        </div>
      </div>

      <div class="toggle">
        <input id="includeCleared" type="checkbox" />
        <label for="includeCleared" style="margin:0;">Include cleared issues</label>
      </div>

      <div class="sep"></div>

      <div class="row">
        <button id="btnRefresh" class="btn primary">Refresh</button>
        <button id="btnTest" class="btn">Test Connection</button>
      </div>

      <div class="footerline">
        <span class="pill" id="pillStatus">Status: <b id="statusText">Not connected</b></span>
        <span class="pill">Auto-refresh: <b>20s</b></span>
      </div>

      <p class="small muted" style="margin-top:10px;">
        Tip: Save your backend URL + name once, then your Chiefs can bookmark this page on the iPad.
      </p>

      <p id="msg" class="small" style="margin:8px 0 0;"></p>
    </section>

    <section class="card">
      <div class="row" style="align-items:baseline;">
        <h2 style="margin:0;">Issues</h2>
        <span class="pill">Count: <b id="issueCount">0</b></span>
        <span class="pill">Last refresh: <b id="lastRefresh">—</b></span>
      </div>

      <div id="issuesList" style="margin-top:12px;"></div>

      <div id="emptyState" class="empty" style="display:none;">
        No issues found for this filter.
      </div>
    </section>
  </main>

  <script src="./chief.js"></script>
</body>
</html>
/div>
    </section>
  </main>

  <script src="./chief.js"></script>
</body>
</html>
