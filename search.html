<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DFD — Search & Print</title>
  <style>
    :root{
      --brand:#c41212; --brand-ink:#fff; --ink:#111; --muted:#666;
      --bg:#fafafa; --card:#fff; --line:#e6e6e6;
      --ok:#1a7f37; --bad:#c81e1e; --warn:#b45309;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial}
    header{
      position:sticky;top:0;z-index:10;
      background:var(--brand);color:var(--brand-ink);
      padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.15)
    }
    .wrap{max-width:1200px;margin:0 auto;padding:0 14px 60px}
    .headRow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .title{display:flex;align-items:center;gap:10px}
    .badgeBrand{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28)}
    h1{margin:0;font-size:18px;letter-spacing:.2px}
    .subhead{margin:0;opacity:.9;font-size:12px}

    .toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
    .toolbar label{font-size:12px;opacity:.95;font-weight:700}
    .toolbar select,.toolbar input{
      height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.14);color:#fff;padding:0 10px;outline:none;font-weight:800
    }
    .toolbar input::placeholder{color:rgba(255,255,255,.8)}
    .toolbar select option{color:#111}

    .btn{
      height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(0,0,0,.12);
      background:#fff;color:#111;font-weight:900;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap
    }

    @media (max-width:760px){
      .toolbar{width:100%;flex-direction:column;align-items:stretch}
      .toolbar > div{width:100%}
      .toolbar select,.toolbar input,.btn{width:100%}
    }

    main{padding-top:14px}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.04);
    }
    .card h2{margin:0 0 8px;font-size:16px;letter-spacing:.2px}
    .note{color:var(--muted);font-size:12px}

    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .tab{
      padding:8px 10px;border-radius:999px;border:1px solid var(--line);
      background:#fff;font-weight:900;cursor:pointer
    }
    .tab.active{border-color:rgba(0,0,0,.2);box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
    .row label{font-weight:900;font-size:12px;color:#333}
    .row select,.row input{
      height:34px;border-radius:10px;border:1px solid var(--line);padding:0 10px;background:#fff;font-weight:800;min-width:180px
    }

    table.grid{
      width:100%;border-collapse:collapse;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff
    }
    .grid thead th{background:#f3f4f6;text-align:left;padding:10px;font-size:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
    .grid tbody td{padding:10px;vertical-align:top;border-bottom:1px solid var(--line)}
    .grid tbody tr:last-child td{border-bottom:none}
    .pill{
      display:inline-block;padding:4px 8px;border-radius:999px;font-weight:900;font-size:11px;border:1px solid rgba(0,0,0,.08)
    }
    .pill.ok{background:rgba(26,127,55,.12);color:var(--ok)}
    .pill.bad{background:rgba(200,30,30,.12);color:var(--bad)}
    .pill.warn{background:rgba(180,83,9,.12);color:var(--warn)}
    .muted{color:var(--muted)}
    .spacer{height:10px}

    /* Print */
    @media print{
      header,.tabs,.row,.btn{display:none !important}
      body{background:#fff}
      .card{border:none;box-shadow:none;padding:0}
      .wrap{padding:0}
      .grid thead th{position:static}
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="headRow">
        <div class="title">
          <div class="badgeBrand"></div>
          <div>
            <h1>DFD — Search & Print</h1>
            <p class="subhead">Search issues (and drug expirations if enabled) • Print friendly</p>
          </div>
        </div>

        <div class="toolbar">
          <a class="btn" href="./administration.html">← Back to Administration</a>
          <button class="btn" id="btnPrint">Print</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="tabs">
        <button class="tab active" id="tabIssues" type="button">Issues</button>
        <button class="tab" id="tabDrugs" type="button">Drug Expirations</button>
      </div>

      <!-- Filters -->
      <div class="row" id="filters">
        <div>
          <label>Station</label><br/>
          <select id="stationSel">
            <option value="all">All Stations</option>
            <option value="1">Station 1</option>
            <option value="2">Station 2</option>
            <option value="3">Station 3</option>
            <option value="4">Station 4</option>
            <option value="5">Station 5</option>
            <option value="6">Station 6</option>
            <option value="7">Station 7</option>
          </select>
        </div>

        <div>
          <label>Status</label><br/>
          <select id="statusSel">
            <option value="active">Active Only</option>
            <option value="resolved">Resolved Only</option>
            <option value="all">All</option>
          </select>
        </div>

        <div style="flex:1 1 260px;min-width:220px">
          <label>Search</label><br/>
          <input id="q" placeholder="Type to filter (apparatus, issue text, note)..." />
        </div>

        <button class="btn" id="btnRun" type="button">Run Search</button>
      </div>

      <div class="spacer"></div>

      <!-- Results -->
      <div id="resultsNote" class="note">Ready.</div>
      <div class="spacer"></div>
      <div style="overflow:auto;max-height:70vh">
        <table class="grid" id="resultsTable">
          <thead>
            <tr id="resultsHeadRow">
              <th>Station</th>
              <th>Apparatus</th>
              <th>Status</th>
              <th>Issue</th>
              <th>Note</th>
              <th>Created</th>
              <th>Updated</th>
              <th>Ack</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="8" class="muted">No data loaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./search.js"></script>
</body>
</html>
