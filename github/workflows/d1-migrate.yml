name: D1 Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run D1 migrations
        run: |
          wrangler d1 execute dfd-system --file migrations/001_d1_schema.sql
          wrangler d1 execute dfd-system --file migrations/002_backfill_checks_summary.sql
