<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Decatur Fire — Checks</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c41212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root{
      --brand:#c41212; --brandInk:#fff;
      --bg:#f6f7f8; --card:#fff; --ink:#111; --muted:#666;
      --radius:14px;

      --ok:#1f9d55;
      --warn:#b07d00;
      --bad:#c81e1e;
    }
    *{box-sizing:border-box}
    body{margin:0; font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--ink)}
    header{background:var(--brand); color:var(--brandInk); padding:14px 16px; position:sticky; top:0; z-index:10}
    header h1{margin:0; font-size:18px}
    main{max-width:980px; margin:0 auto; padding:14px}
    .card{background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:12px}
    label{display:block; font-weight:600; margin:10px 0 6px}
    input, select, textarea, button{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid #d7dbe0; font:inherit; background:#fff;
    }
    textarea{min-height:70px; resize:vertical}
    .row{display:grid; gap:12px}
    @media (min-width:760px){ .row{grid-template-columns: 1fr 1fr} }
    .row3{display:grid; gap:12px}
    @media (min-width:960px){ .row3{grid-template-columns: 1fr 1fr 1fr} }
    .muted{color:var(--muted); font-size:13px}
    .hr{height:1px; background:#e6e9ee; margin:14px 0}
    .btn{
      background:var(--brand); color:#fff; border:none; cursor:pointer; font-weight:800;
      padding:12px 14px;
    }
    .btn:active{transform:translateY(1px)}
    ul{margin:8px 0 0 18px}
    #status{font-weight:700}
    .pill{
      display:inline-block; padding:4px 10px; border-radius:999px;
      background:#eef1f5; color:#333; font-size:12px; font-weight:700;
    }

    /* ===== Drug expiration highlighting (NO layout changes) ===== */
    /* Row-level highlight (most reliable, doesn't need specific TD structure) */
    tr.exp-green td { background: rgba(31,157,85,.10) !important; }
    tr.exp-yellow td{ background: rgba(176,125,0,.12) !important; }
    tr.exp-red td   { background: rgba(200,30,30,.12) !important; }

    /* Legend pills */
    .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .legend .k{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
    .dot{width:10px;height:10px;border-radius:999px;display:inline-block}
    .dot.g{background:rgba(31,157,85,.9)}
    .dot.y{background:rgba(176,125,0,.9)}
    .dot.r{background:rgba(200,30,30,.9)}
  </style>
</head>

<body>
  <header>
    <h1>Decatur Fire — Daily / Weekly Checks (Alpha)</h1>
  </header>

  <main>
    <div class="card">
      <div class="row3">
        <div>
          <label for="who">Completed By</label>
          <input id="who" placeholder="Name">
        </div>

        <div>
          <label for="station">Station</label>
          <select id="station"></select>
        </div>

        <div>
          <label for="apparatus">Apparatus</label>
          <select id="apparatus"></select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="checkType">Check Type</label>
          <select id="checkType"></select>
        </div>

        <div>
          <label>&nbsp;</label>
          <button id="saveBtn" class="btn" type="button">Save</button>
        </div>
      </div>

      <div class="hr"></div>

      <div>
        <label>Current / Active Issues</label>
        <div class="muted">Open issues for the selected station + apparatus.</div>
        <ul id="activeIssues"><li class="muted">Loading…</li></ul>
      </div>

      <div class="hr"></div>

      <div class="row">
        <div>
          <label for="newIssue">New Issue <span class="pill">Email only sends if filled</span></label>
          <textarea id="newIssue" placeholder="Describe the new issue (leave blank if no new issue)."></textarea>
        </div>
        <div>
          <label for="newIssueNote">Bullet Note (optional)</label>
          <input id="newIssueNote" placeholder="Short note shown next to the issue (optional)">
          <div class="muted" style="margin-top:8px">
            Examples: “OOS”, “Waiting on parts”, “Needs mechanic”, “Placed spare”.
          </div>
        </div>
      </div>

      <div style="margin-top:12px">
        <div id="status" class="muted">Loading…</div>
      </div>
    </div>

    <div class="card">
      <label>Check Form</label>

      <!-- Added legend only (doesn't change dropdown flow/layout) -->
      <div class="legend" id="drugLegend" style="display:none">
        <span class="k"><span class="dot g"></span> Exp > 30 days (Green)</span>
        <span class="k"><span class="dot y"></span> Exp 15–30 days (Yellow)</span>
        <span class="k"><span class="dot r"></span> Exp ≤ 14 days / expired (Red)</span>
      </div>

      <div id="formArea" class="muted">Select a check type to begin.</div>
    </div>
  </main>

  <!-- Service worker registration (auto updates without hard refresh) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js").then((reg) => {
        reg.onupdatefound = () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.onstatechange = () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          };
        };
      }).catch(() => {});
    }
  </script>

  <script src="/app.js"></script>

  <!-- Expiration highlighting hook (safe, does nothing unless it finds your med table) -->
  <script>
    (function(){
      const MS_PER_DAY = 24*60*60*1000;

      function todayMidnight(){
        const d = new Date();
        d.setHours(0,0,0,0);
        return d;
      }

      function daysUntil(expStr){
        if (!expStr) return null;
        const exp = new Date(expStr + "T00:00:00");
        const diff = exp.getTime() - todayMidnight().getTime();
        return Math.floor(diff / MS_PER_DAY);
      }

      // Green: >30, Yellow: 15-30, Red: <=14
      function expBucket(expStr){
        const d = daysUntil(expStr);
        if (d === null) return null;
        if (d <= 14) return "red";
        if (d <= 30) return "yellow";
        return "green";
      }

      function applyDrugHighlight(tr){
        const expInput = tr.querySelector('.md-exp');
        if (!expInput) return;

        const bucket = expBucket(expInput.value || "");
        tr.classList.remove('exp-green','exp-yellow','exp-red');

        if (bucket === "green") tr.classList.add('exp-green');
        if (bucket === "yellow") tr.classList.add('exp-yellow');
        if (bucket === "red") tr.classList.add('exp-red');
      }

      function hookMedTable(){
        const tbl = document.querySelector('#md_drugs');
        const legend = document.querySelector('#drugLegend');

        if (!tbl) return false;

        // show legend once med table exists
        if (legend) legend.style.display = '';

        const tbody = tbl.querySelector('tbody');
        if (!tbody) return true;

        // initial pass + listeners
        Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
          const expInput = tr.querySelector('.md-exp');
          if (expInput && !expInput.__dfd_bound){
            expInput.__dfd_bound = true;
            expInput.addEventListener('change', () => applyDrugHighlight(tr));
            expInput.addEventListener('input',  () => applyDrugHighlight(tr));
          }
          applyDrugHighlight(tr);
        });

        return true;
      }

      // Observe for med form being rendered dynamically into #formArea
      const obs = new MutationObserver(() => {
        hookMedTable();
      });

      obs.observe(document.body, { childList:true, subtree:true });

      // best-effort initial run
      hookMedTable();
    })();
  </script>
</body>
</html>
