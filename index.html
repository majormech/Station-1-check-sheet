<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decatur Fire — Checks (Alpha)</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#c41212">
</head>
<body>
  <header class="header">
    <h1>Decatur Fire — Station 1 Checks (Alpha)</h1>

    <div class="row">
      <label>
        Completed By
        <input id="who" placeholder="Name" autocomplete="name">
      </label>

      <label>
        Station
        <select id="station"></select>
      </label>

      <label>
        Apparatus
        <select id="apparatus"></select>
      </label>

      <label>
        Check Type
        <select id="checkType"></select>
      </label>
    </div>
  </header>

  <main class="main">
    <section class="card">
      <h2>Active Issues</h2>
      <ul id="activeIssues" class="issues"></ul>
    </section>

    <section class="card">
      <h2>New Issue (email only if filled + new)</h2>
      <label>
        Issue
        <textarea id="newIssue" rows="3" placeholder="Describe the issue..."></textarea>
      </label>
      <label>
        Bullet Note (shown next to issue)
        <input id="newIssueNote" placeholder="Optional note">
      </label>
    </section>

    <section class="card">
      <h2>Form</h2>
      <div id="formArea"></div>
      <button id="saveBtn" class="btn">Save</button>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/service-worker.js");
  </script>
</body>
</html>
